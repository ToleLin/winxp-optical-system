name: 建置與測試

on:
  push:
  pull_request:
  # 在 Actions 頁面按「Run workflow」；填入版本標籤就會在建置、測試後發佈 Release
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要發佈的版本標籤（例如 v0.2.1，須和 Directory.Build.props 的版本一致；只能從 main 發佈）。留空只建置與測試
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Microsoft 官方 SDK 含 WPF 編譯支援，可在 Linux 上產生 Windows 程式
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 安裝 QEMU（整合測試）、zstd（解開 MSYS2 套件）與 NSIS（安裝檔）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils zstd nsis

      - name: 測試
        run: dotnet test tests/XPOptical.Core.Tests -c Release

      - name: 打包免安裝版
        run: ./tools/package.sh

      - name: 上傳安裝檔
        uses: actions/upload-artifact@v7
        with:
          name: XPOptical-Setup
          path: dist/XPOptical-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 上傳免安裝版
        uses: actions/upload-artifact@v7
        with:
          name: XPOptical-win-x64
          path: dist/XPOptical/
          retention-days: 30

      - name: 上傳發佈用檔案（發佈版本時）
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag != '' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/XPOptical-Setup-*.exe
            dist/XPOptical-*-win-x64.zip
            dist/XPOptical/engine/engine-manifest.json
          if-no-files-found: error
          retention-days: 1

  # 推送版本標籤（例如 v0.2.1），或在 main 上按「Run workflow」並填入版本標籤時，把安裝檔發佈到 GitHub Releases。
  # 只有這個工作有寫入權限；建置與測試在上面唯讀的工作完成。
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag != '' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: 發佈到 Releases（含執行引擎原始碼）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: ./tools/publish-release.sh "$RELEASE_TAG" release
