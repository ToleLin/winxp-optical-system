name: 建置與測試

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Microsoft 官方 SDK 含 WPF 編譯支援，可在 Linux 上產生 Windows 程式
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 安裝 QEMU（整合測試）與 zstd（解開 MSYS2 套件）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils zstd

      - name: 測試
        run: dotnet test tests/XPOptical.Core.Tests -c Release

      - name: 打包免安裝版
        run: ./tools/package.sh

      - name: 上傳免安裝版
        uses: actions/upload-artifact@v7
        with:
          name: XPOptical-win-x64
          path: dist/XPOptical/
          retention-days: 30
